<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 週年慶遊戲</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  background:radial-gradient(ellipse at top,#2a1010 0%,#1c0d0d 70%);
  color:#ffd76a;
  font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4vh;padding:24px 16px;min-height:100vh;
}
h1{
  font-size:clamp(30px,6vw,64px);letter-spacing:6px;
  text-shadow:0 0 16px rgba(255,215,106,.4);text-align:center;
}
.games{display:flex;gap:3vw;flex-wrap:wrap;justify-content:center;align-items:stretch}
a.game{
  display:flex;flex-direction:column;align-items:center;gap:1.6vh;
  background:#2b1414;border:3px solid #7a5a2a;border-radius:26px;
  padding:16px 16px 2vh;text-decoration:none;color:#ffd76a;
  width:min(88vw,30vw,56vh);min-width:260px;
  transition:transform .15s ease,border-color .15s ease;
  animation:breathe 2.8s ease-in-out infinite;
}
.games a.game:nth-child(2){animation-delay:.9s}
.games a.game:nth-child(3){animation-delay:1.8s}
@keyframes breathe{
  0%,100%{box-shadow:0 0 12px rgba(255,215,106,.22)}
  50%{box-shadow:0 0 30px rgba(255,215,106,.6),0 0 60px rgba(255,180,60,.25)}
}a.game:hover{
  transform:scale(1.06);border-color:#ffd76a;
  animation:none;
  box-shadow:0 0 40px rgba(255,215,106,.9),0 0 90px rgba(255,180,60,.5),0 0 140px rgba(255,150,40,.3);
}
.imgwrap{position:relative;overflow:hidden;border-radius:18px;width:100%}
.imgwrap img{width:100%;height:auto;display:block}
.imgwrap::after{
  content:'';position:absolute;top:-60%;left:-85%;width:55%;height:220%;
  transform:rotate(25deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);
  opacity:0;pointer-events:none;
}
a.game:hover .imgwrap::after{animation:shine .9s ease}
@keyframes shine{
  0%{left:-85%;opacity:0}
  25%{opacity:1}
  100%{left:135%;opacity:0}
}
.desc{font-size:clamp(15px,2.4vh,22px);color:#e8c987;letter-spacing:2px;text-align:center}
</style>
</head>
<body>
<h1>🏮 2026 週年慶遊戲 🏮</h1>
<div class="games">
  <a class="game" href="bingo.html">
    <span class="imgwrap"><img src="img/bingo.png" alt="神仙賓果樂"></span>
    <span class="desc">36 尊仙佛・抽籤對號賓果</span>
  </a>
  <a class="game" href="dice.html">
    <span class="imgwrap"><img src="img/dice.png" alt="歡樂骰子王"></span>
    <span class="desc">四顆骰子・選號對獎</span>
  </a>
  <a class="game" href="https://script.google.com/macros/s/AKfycbwtj0WI6GPldwi5jfUVeboLuVi9s22FT2nfdcP1NwsfSgpdPsT1koJcao0_0TwS1Fnu/exec?page=score">
    <span class="imgwrap"><img src="img/charades.png" alt="比手畫腳"></span>
    <span class="desc">一起來猜題・即時計分榜</span>
  </a>
</div>
</body>
</html>
