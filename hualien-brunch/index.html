<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>10/19 早午餐用餐分流登記｜2026 花蓮宜蘭之旅</title>
<meta property="og:title" content="🍽 10/19 早午餐 用餐分流登記">
<meta property="og:description" content="長榮礁溪自助式早午餐 · 一房派一人登記，同房的人一起登記同一個時段">
<meta name="description" content="長榮礁溪自助式早午餐 · 一房派一人登記，同房的人一起登記同一個時段">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px 12px 60px; font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
         background: linear-gradient(180deg, #f7f1e8, #f5f7fb); color: #2f2f2f; font-size: 20px; min-height: 100vh; }
  .wrap { max-width: 560px; margin: 0 auto; }
  .card { background: #fff; border-radius: 18px; box-shadow: 0 6px 18px rgba(0,0,0,.08); padding: 18px 16px; margin-bottom: 14px; }
  .brand { text-align: center; font-size: 16px; font-weight: 700; color: #9a7b55; letter-spacing: .08em; }
  h1 { font-size: 28px; color: #5b351b; margin: 4px 0 2px; text-align: center; }
  .sub { text-align: center; color: #7a5a3a; font-size: 20px; font-weight: 700; margin-bottom: 10px; }
  .rule { font-size: 18px; line-height: 1.7; color: #5a4632; background: #fff8ea; border: 1px dashed #d4a017; border-radius: 12px; padding: 10px 14px; }
  .step { font-size: 21px; font-weight: 900; color: #5b351b; margin-bottom: 8px; }
  input#name { width: 100%; font-size: 24px; padding: 14px; border: 2px solid #cdb89a; border-radius: 12px; }
  button { font-family: inherit; }
  .btn { width: 100%; font-size: 22px; font-weight: 900; padding: 14px; border: 0; border-radius: 12px; background: #8b542f; color: #fff; margin-top: 12px; cursor: pointer; }
  .btn:disabled { background: #cfc5b8; cursor: default; }
  .btn.gray { background: #9a9a9a; }
  .msg { font-size: 19px; font-weight: 800; margin-top: 10px; line-height: 1.5; }
  .msg.err { color: #c0392b; } .msg.ok { color: #1c7c3a; }
  .room { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 6px; }
  .mate { background: #f3ede2; border: 2px solid #b8956a; border-radius: 10px; padding: 4px 12px; font-size: 22px; font-weight: 900; color: #5b351b; }
  .now { font-size: 19px; line-height: 1.6; margin-top: 6px; }
  .slots { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .slot { border: 3px solid #d9d0c3; border-radius: 16px; padding: 14px 6px; text-align: center; background: #fff; cursor: pointer; user-select: none; }
  .slot .k { font-size: 18px; font-weight: 900; color: #7a5a3a; }
  .slot .tm { font-size: 24px; font-weight: 900; margin: 4px 0; }
  .slot .left { font-size: 16px; font-weight: 700; color: #c0392b; }
  .slot.sel { border-color: #1c7c3a; background: #eefaf0; box-shadow: inset 0 0 0 3px rgba(28,124,58,.18); }
  .slot.sel .k::after { content: " ✔"; color: #1c7c3a; }
  .slot.off { opacity: .45; cursor: not-allowed; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .overlay.show { display: flex; }
  .dialog { background: #fff; border-radius: 18px; max-width: 480px; width: 100%; padding: 22px 18px; }
  .dialog h2 { margin: 0 0 10px; font-size: 25px; color: #5b351b; }
  .dialog .who { font-size: 22px; font-weight: 900; line-height: 1.6; margin: 6px 0; }
  .dialog .when { font-size: 23px; font-weight: 900; color: #1c7c3a; margin: 10px 0 4px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .foot { text-align: center; font-size: 17px; margin-top: 18px; }
  .foot a { color: #8b542f; font-weight: 800; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="brand">2026 虛空無極殿 · 花蓮宜蘭之旅</div>
    <h1>🍽 10/19（一）早午餐</h1>
    <div class="sub">長榮礁溪 自助式早午餐 · 用餐分流</div>
    <div class="rule">
      一房派<b>一個人</b>登記就好，<b>同房的人會一起</b>登記同一個時段。<br>
      第一時段 10:00–11:30 約 <b>100 人</b>（最多 110 人，額滿請選第二時段）；<br>
      沒有登記的人，<b>由小秘書分配</b>，感謝！
    </div>
  </div>

  <div class="card" id="step1">
    <div class="step">① 輸入你的名字</div>
    <input id="name" type="text" placeholder="報名時的全名" autocomplete="off">
    <button class="btn" id="btnFind">查詢我的房間</button>
    <div class="msg" id="msg1"></div>
  </div>

  <div class="card hidden" id="step2">
    <div class="step">② 你們這房（<span id="rn"></span> 位）</div>
    <div class="room" id="room"></div>
    <div class="now" id="now"></div>
    <div class="step" style="margin-top:16px">③ 選時段</div>
    <div class="slots">
      <div class="slot" id="slotA"><div class="k">第一時段</div><div class="tm">10:00–11:30</div><div class="left" id="leftA"></div></div>
      <div class="slot" id="slotB"><div class="k">第二時段</div><div class="tm">11:30–13:00</div></div>
    </div>
    <button class="btn" id="btnSend" disabled>送出</button>
    <div class="msg" id="msg2"></div>
    <button class="btn gray" id="btnReset">查詢別的名字</button>
  </div>

  <div class="foot">登記好的時段，也會顯示在 <a id="qlink" href="#" target="_blank" rel="noopener">行程查詢系統</a> 裡</div>
</div>

<div class="overlay" id="ov">
  <div class="dialog">
    <h2>請再確認一次</h2>
    <div>幫以下 <b id="cn"></b> 位登記：</div>
    <div class="who" id="cwho"></div>
    <div class="when" id="cwhen"></div>
    <div class="row2">
      <button class="btn gray" id="btnNo">取消</button>
      <button class="btn" id="btnYes">確定登記</button>
    </div>
  </div>
</div>

<script>
// 花蓮宜蘭查詢系統（Google Apps Script）的資料介面：名單、房間、登記都存在總表的 Google 試算表
var API = 'https://script.google.com/macros/s/AKfycbwlWbZzxvpgdG6CU9LS4bczYSzgpM9cxd8-CJWTbKtxJvFM3nX05Dk_5NrAaE2gK7SN/exec';
var cur = null, pick = '';

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function slotName(c, label) { return (label === c.labelA ? '第一時段 ' : '第二時段 ') + label; }

// JSONP 呼叫（跟查詢系統原本的網站用同一套）
function api(params, ok, fail) {
  var cb = '__brunch' + Date.now() + Math.floor(Math.random() * 1000);
  var s = document.createElement('script');
  var done = false;
  function cleanup() { try { delete window[cb]; } catch (e) { window[cb] = undefined; } if (s.parentNode) s.parentNode.removeChild(s); }
  var timer = setTimeout(function () { if (done) return; done = true; cleanup(); fail(new Error('連線逾時，請再試一次')); }, 25000);
  window[cb] = function (res) {
    if (done) return; done = true; clearTimeout(timer); cleanup();
    if (res && res.type === 'error') fail(new Error(res.message || '系統忙碌中，請再試一次'));
    else ok(res || {});
  };
  s.onerror = function () { if (done) return; done = true; clearTimeout(timer); cleanup(); fail(new Error('連線失敗，請再試一次')); };
  var q = Object.keys(params).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); }).join('&');
  s.src = API + '?' + q + '&callback=' + cb;
  document.body.appendChild(s);
}

function find() {
  var n = $('name').value.trim();
  if (!n) { $('msg1').className = 'msg err'; $('msg1').textContent = '請先輸入名字'; return; }
  $('msg1').className = 'msg'; $('msg1').textContent = '查詢中…'; $('btnFind').disabled = true;
  api({ action: 'brunch', name: n },
    function (r) { $('btnFind').disabled = false; render(r); },
    function (e) { $('btnFind').disabled = false; $('msg1').className = 'msg err'; $('msg1').textContent = '查詢失敗：' + e.message; });
}

function render(r, okMsg, errMsg) {
  if (!r.ok) { $('msg1').className = 'msg err'; $('msg1').textContent = r.msg || '查無此人'; $('step2').classList.add('hidden'); return; }
  cur = r; pick = '';
  $('msg1').textContent = '';
  $('rn').textContent = r.room.length;
  $('room').innerHTML = r.room.map(function (x) { return '<span class="mate">' + esc(x) + '</span>'; }).join('');
  var c = r.counts;
  $('now').innerHTML = r.slot
    ? '✅ 已登記：<b>' + esc(slotName(c, r.slot)) + '</b><br><span style="font-size:17px;color:#666">（' + esc(r.by) + (r.at ? ' ' + esc(r.at) : '') + ' 登記；要改時段，在下面重選再送出）</span>'
    : '目前：<b>還沒登記</b>（沒登記的人由小秘書分配）';
  // 第一時段名額不夠整房就擋掉，但不顯示人數
  var mineA = r.slot === c.labelA ? r.room.length : 0;
  var okA = c.capA - c.countA + mineA >= r.room.length;
  $('leftA').textContent = okA ? '' : '已額滿';
  $('slotA').classList.toggle('off', !okA);
  $('slotA').classList.remove('sel'); $('slotB').classList.remove('sel');
  $('btnSend').disabled = true;
  $('msg2').className = 'msg ' + (errMsg ? 'err' : 'ok');
  $('msg2').textContent = errMsg || okMsg || '';
  $('step2').classList.remove('hidden');
  if (!okMsg && !errMsg) $('step2').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function choose(id) {
  if (!cur || $('slot' + id).classList.contains('off')) return;
  pick = id;
  $('slotA').classList.toggle('sel', id === 'A');
  $('slotB').classList.toggle('sel', id === 'B');
  $('btnSend').disabled = false;
  $('msg2').textContent = '';
}

function askConfirm() {
  if (!cur || !pick) return;
  var c = cur.counts;
  $('cn').textContent = cur.room.length;
  $('cwho').textContent = cur.room.join('、');
  $('cwhen').textContent = '時段：' + (pick === 'A' ? '第一時段 ' + c.labelA : '第二時段 ' + c.labelB);
  $('ov').classList.add('show');
}

function send() {
  $('btnYes').disabled = true; $('btnYes').textContent = '登記中…';
  api({ action: 'brunchReg', name: cur.name, slot: pick },
    function (r) {
      $('btnYes').disabled = false; $('btnYes').textContent = '確定登記'; $('ov').classList.remove('show');
      if (r.saved) render(r, '✅ 登記完成！你們這房是 ' + slotName(r.counts, r.slot));
      else render(r, '', r.msg || '登記失敗，請再試一次');
    },
    function (e) {
      $('btnYes').disabled = false; $('btnYes').textContent = '確定登記'; $('ov').classList.remove('show');
      $('msg2').className = 'msg err'; $('msg2').textContent = '登記失敗：' + e.message;
    });
}

$('qlink').href = API;
$('btnFind').onclick = find;
$('name').addEventListener('keydown', function (e) { if (e.key === 'Enter') find(); });
$('slotA').onclick = function () { choose('A'); };
$('slotB').onclick = function () { choose('B'); };
$('btnSend').onclick = askConfirm;
$('btnNo').onclick = function () { $('ov').classList.remove('show'); };
$('btnYes').onclick = send;
$('btnReset').onclick = function () { cur = null; pick = ''; $('step2').classList.add('hidden'); $('msg1').textContent = ''; $('name').value = ''; $('name').focus(); window.scrollTo(0, 0); };
// 先叫醒後端，第一次查詢比較快（結果不用顯示）
api({ action: 'brunch', name: '' }, function () {}, function () {});
</script>
</body>
</html>
